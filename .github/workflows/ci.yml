name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  verify:
    name: Unit, race, vet, diff, and fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
          cache-dependency-path: go.sum

      - name: Download modules
        run: go mod download

      - name: Unit tests
        run: go test ./... -short -count=1

      - name: Race tests
        run: go test -race ./... -short

      - name: Vet
        run: go vet ./...

      - name: Diff whitespace check
        env:
          IAMCORE_CI_EVENT_NAME: ${{ github.event_name }}
          IAMCORE_CI_HEAD_SHA: ${{ github.sha }}
          IAMCORE_CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          IAMCORE_CI_BEFORE_SHA: ${{ github.event.before }}
        run: bash .github/scripts/check-diff.sh

      - name: Fuzz transport decoder
        run: go test ./internal/transport -run '^$' -fuzz=FuzzDecodeJSON -fuzztime=10s

      - name: Fuzz return_to validation
        run: go test ./authn -run '^$' -fuzz=FuzzReturnTo -fuzztime=10s

  redis:
    name: Redis ${{ matrix.redis-image }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        redis-image:
          - redis:6.2-alpine
          - redis:7.4-alpine
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
          cache-dependency-path: go.sum

      - name: Download modules
        run: go mod download

      - name: Redis package
        env:
          IAMCORE_TEST_REDIS_IMAGE: ${{ matrix.redis-image }}
        run: go test ./session/redis -count=1 -timeout=5m
