name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  root:
    name: Root normal/race/vet/standalone/dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
          cache-dependency-path: go.sum
      - name: Download root modules
        run: go mod download
      - name: Root tests
        run: go test ./... -count=1
      - name: Root race tests
        run: go test -race ./... -count=1
      - name: Root vet
        run: go vet ./...
      - name: Root examples
        run: go build ./examples/...
      - name: Standalone root tests
        run: GOWORK=off go test ./... -count=1
      - name: Standalone root race tests
        run: GOWORK=off go test -race ./... -count=1
      - name: Standalone root vet
        run: GOWORK=off go vet ./...
      - name: Published root dependency boundary
        shell: bash
        run: |
          set -euo pipefail
          if GOWORK=off go list -m all | grep -Eiq '(gin-gonic|go-redis|docker|moby|testcontainers)'; then
            echo "forbidden module in root dependency graph" >&2
            exit 1
          fi
          if GOWORK=off go list -deps ./... | grep -Eiq '(gin-gonic|go-redis|docker|moby|testcontainers)'; then
            echo "forbidden package in root dependency graph" >&2
            exit 1
          fi
      - name: Diff whitespace check
        env:
          IAMCORE_CI_EVENT_NAME: ${{ github.event_name }}
          IAMCORE_CI_HEAD_SHA: ${{ github.sha }}
          IAMCORE_CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          IAMCORE_CI_BEFORE_SHA: ${{ github.event.before }}
        run: bash .github/scripts/check-diff.sh

  gin:
    name: Gin normal/race/vet/example
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
          cache-dependency-path: adapters/gin/go.sum
      - name: Download Gin modules
        working-directory: adapters/gin
        run: go mod download
      - name: Gin tests
        working-directory: adapters/gin
        run: go test ./... -count=1
      - name: Gin race tests
        working-directory: adapters/gin
        run: go test -race ./... -count=1
      - name: Gin vet
        working-directory: adapters/gin
        run: go vet ./...
      - name: Gin example
        working-directory: adapters/gin
        run: go build -o /tmp/iamcore-gin-example ./example

  redis:
    name: Redis adapter normal/race/vet/example
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
          cache-dependency-path: adapters/redis/go.sum
      - name: Download Redis adapter modules
        working-directory: adapters/redis
        run: go mod download
      - name: Redis adapter tests
        working-directory: adapters/redis
        run: go test ./... -count=1
      - name: Redis adapter race tests
        working-directory: adapters/redis
        run: go test -race ./... -count=1
      - name: Redis adapter vet
        working-directory: adapters/redis
        run: go vet ./...
      - name: Redis adapter example
        working-directory: adapters/redis
        run: go build -o /tmp/iamcore-redis-example ./example

  integration:
    name: Integration Redis 6.2/7.4 normal/race/vet
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
          cache-dependency-path: integration/go.sum
      - name: Download integration modules
        working-directory: integration
        run: go mod download
      - name: Redis 6.2 and 7.4 integration tests
        working-directory: integration
        run: GOTOOLCHAIN=local go test ./redis -count=1
      - name: Redis 6.2 and 7.4 integration race tests
        working-directory: integration
        run: GOTOOLCHAIN=local go test -race ./redis -count=1
      - name: Integration vet
        working-directory: integration
        run: GOTOOLCHAIN=local go vet ./...

  release:
    name: Merge dev to main and create SDK tag
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs:
      - root
      - gin
      - redis
      - integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out dev revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge dev and create version tag
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! LC_ALL=C grep -axEq '[0-9]+\.[0-9]+\.[0-9]+' VERSION; then
            echo "VERSION must use X.Y.Z format" >&2
            exit 1
          fi
          version_byte_count=$(LC_ALL=C wc -c < VERSION)
          matching_version_byte_count=$(LC_ALL=C grep -axE '[0-9]+\.[0-9]+\.[0-9]+' VERSION | LC_ALL=C wc -c)
          matching_version_line_count=$(LC_ALL=C grep -axE '[0-9]+\.[0-9]+\.[0-9]+' VERSION | LC_ALL=C wc -l)
          if [[ "${matching_version_line_count}" -ne 1 || "${matching_version_byte_count}" -ne "${version_byte_count}" ]]; then
            echo "VERSION must contain exactly one X.Y.Z line" >&2
            exit 1
          fi
          IFS= read -r release_version < VERSION
          if [[ ! "${release_version}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "VERSION must use X.Y.Z format" >&2
            exit 1
          fi
          release_tag="v${release_version}"

          git fetch origin main dev --tags
          if git rev-parse --verify --quiet "refs/tags/${release_tag}" >/dev/null; then
            echo "tag ${release_tag} already exists" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B main origin/main
          git merge --no-ff "$RELEASE_SHA" -m "chore(release): ${release_tag}"
          git tag -a "${release_tag}" -m "IAM Core SDK ${release_tag}"
          git push --atomic origin main "${release_tag}"
