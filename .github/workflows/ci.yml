name: Release

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  release:
    name: Merge dev to main and create version tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge and tag
        shell: bash
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          release_version=$(< VERSION)
          if [[ ! "${release_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must use X.Y.Z format" >&2
            exit 1
          fi
          release_tag="v${release_version}"

          git fetch origin main --tags
          if git rev-parse --verify --quiet "refs/tags/${release_tag}" >/dev/null; then
            echo "tag ${release_tag} already exists" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B main origin/main
          git merge --no-ff "${GITHUB_SHA}" -m "chore(release): ${release_tag}"
          git tag -a "${release_tag}" -m "IAM Core SDK ${release_tag}"
          git push --atomic origin main "${release_tag}"
